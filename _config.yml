# Site settings. Change the title, description, or LinkedIn address here.
title: Chris Blocher | Technical Writer & Mentor
description: I specialize in creating clear, engaging, and user-centric content experiences. With a passion for accessible design and strategic storytelling.
lang: en-US
linkedin: "https://www.linkedin.com/in/chrisblocher"

# Plugins that GitHub Pages supports.
# redirect-from keeps old addresses working. seo-tag writes the page title and sharing tags.
plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag

# Layouts are chosen here so pages do not each need a layout line.
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "projects"
    values:
      layout: project

# Files that are in the repository but must not be published.
# _originals holds full-size source images and is never edited in place.
exclude:
  - README.md
  - _originals
  # Temporary: the old stylesheet source imports the Primer theme, which this file no longer sets.
  # It is removed in phase 5, after the new site is reviewed. Then delete this line.
  - assets/css/style.scss
